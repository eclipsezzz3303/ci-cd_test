name: Python CI/CD                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                      
on:                                                                                                                                                                                                                                                                 
  push:                                                                                                                                                                                                                                                             
    branches: [ main ]                                                                                                                                                                                                                                              
    tags: [ 'v*' ]                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                    
jobs:                                                                                                                                                                                                                                                               
  # ===== 任务一：测试 =====                                                                                                                                                                                                                                        
  test:                                                                                                                                                                                                                                                             
    runs-on: ubuntu-latest                                                                                                                                                                                                                                          
    steps:                                                                                                                                                                                                                                                          
      - name: 拉取代码                                                                                                                                                                                                                                              
        uses: actions/checkout@v4                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                    
      - name: 安装 Python                                                                                                                                                                                                                                           
        uses: actions/setup-python@v5                                                                                                                                                                                                                               
        with:                                                                                                                                                                                                                                                       
          python-version: '3.11'                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                    
      - name: 安装依赖                                                                                                                                                                                                                                              
        run: pip install -r requirements.txt                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                    
      - name: 运行测试                                                                                                                                                                                                                                              
        run: pytest tests/ -v                                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                    
  # ===== 任务二：构建并推送 Docker 镜像到 GHCR =====                                                                                                                                                                                                               
  docker:                                                                                                                                                                                                                                                           
    needs: test                              # 测试通过后才构建镜像                                                                                                                                                                                                 
    if: startsWith(github.ref, 'refs/tags/') # 只有打标签时才构建发布                                                                                                                                                                                               
    runs-on: ubuntu-latest                                                                                                                                                                                                                                          
    permissions:                                                                                                                                                                                                                                                    
      contents: read                         # 读代码                                                                                                                                                                                                               
      packages: write                        # 关键：允许推送镜像到 GHCR                                                                                                                                                                                            
    steps:                                                                                                                                                                                                                                                          
      - name: 拉取代码                                                                                                                                                                                                                                              
        uses: actions/checkout@v4                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                    
      - name: 登录到 GHCR                                                                                                                                                                                                                                           
        uses: docker/login-action@v3                                                                                                                                                                                                                                
        with:                                                                                                                                                                                                                                                       
          registry: ghcr.io                  # GHCR 的地址                                                                                                                                                                                                          
          username: ${{ github.actor }}      # 自动用触发者的 GitHub 用户名                                                                                                                                                                                         
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub 自动提供的临时令牌，无需手动创建                                                                                                                                                                          
                                                                                                                                                                                                                                                                    
      - name: 构建并推送镜像                                                                                                                                                                                                                                        
        uses: docker/build-push-action@v6                                                                                                                                                                                                                           
        with:                                                                                                                                                                                                                                                       
          context: .                         # 用当前目录（含 Dockerfile）构建                                                                                                                                                                                      
          push: true                         # 构建后推送到 GHCR                                                                                                                                                                                                    
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}                                                                                                                                                                                             
          # 镜像标签格式：ghcr.io/用户名/仓库名:版本号                                                                                                                                                                                                              
          # 例如打 v1.2 标签 → ghcr.io/eclipsezzz3303/ci-cd_test:v1.2 